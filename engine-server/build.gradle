/*
 * ============================================================
 * engine-server — 核心业务模块（:8081）
 * ------------------------------------------------------------
 * DDD 四层架构（见 docs/architecture.md）：
 *   interfaces/      接入层：REST 控制器、SSE 推送
 *   application/     应用层：用例编排（状态机、事务边界）
 *   domain/          领域层：纯业务模型 + 仓储接口（零框架依赖）
 *   infrastructure/  基础设施层：Py4J/stdio 通道、SQLite、Lucene 等技术实现
 *
 * 【教学注释】依赖方向只能从上往下：interfaces → application → domain ← infrastructure
 *   domain 层不依赖任何框架（纯 POJO + 接口），infrastructure 实现 domain 定义的接口——
 *   这就是"依赖倒置"：高层策略（domain）不依赖低层细节（SQLite/Python），细节依赖策略。
 * ============================================================
 */

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // ---------- Web 与观测 ----------
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // WebSocket：进度推送的进阶通道（主通道是 SSE，见 infrastructure/realtime）
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // 参数校验（@Valid + jakarta.validation 注解）
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 健康检查 /actuator/health（网关会探测这个端点做健康联动）
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ---------- Python 通道 ----------
    // Py4J：Java↔Python 的本机环回 socket 通道（默认通道）
    implementation 'net.sf.py4j:py4j:0.10.9.7'

    // ---------- 持久化 ----------
    // SQLite：嵌入式单文件数据库，向量与文档元数据持久化（零外部服务依赖）
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'

    // ---------- 全文检索 ----------
    // Lucene 8.11.2 是支持 JDK 1.8 的最后大版本（9.x 需要 Java 11+）
    implementation 'org.apache.lucene:lucene-core:8.11.2'
    // 【修复蓝本缺陷】蓝本注释掉了中文分词器依赖，导致中文检索退化为"单字切分"，搜索质量极差
    // 【注意】Lucene 8.x 的通用模块名是 lucene-analyzers-common（analyzers 复数），
    // 9.x 才改名 lucene-analysis-common——蓝本很可能就是写错模块名装不上才注释掉的
    implementation 'org.apache.lucene:lucene-analyzers-common:8.11.2'
    // 【依赖坑】SmartChineseAnalyzer 不在 analyzers-common 里！Lucene 把语种分析器
    // 拆成独立构件：中文 SmartCN、日文 kuromoji 各自一个 artifact——漏引这个包，
    // 编译期才报"程序包 org.apache.lucene.analysis.cn.smart 不存在"
    implementation 'org.apache.lucene:lucene-analyzers-smartcn:8.11.2'
    implementation 'org.apache.lucene:lucene-queryparser:8.11.2'
    implementation 'org.apache.lucene:lucene-highlighter:8.11.2'

    // ---------- 缓存 ----------
    // Caffeine 2.9.3 是 JDK 8 兼容线（3.x 需要 Java 11+）
    implementation 'com.github.ben-manes.caffeine:caffeine:2.9.3'

    // ---------- 文档解析 ----------
    // PDFBox 2.0.x：PDF 文本提取（JDK 8 兼容线）
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
    // POI 4.1.2：DOCX 文本提取（5.x 依赖树庞大，4.x 教学环境更稳）
    implementation 'org.apache.poi:poi-ooxml:4.1.2'
}

// ============================================================
// Python 脚本打包：让 python/ 目录随 jar 一起部署
// ------------------------------------------------------------
// 【设计意图】用户核心诉求"Python 代码嵌入 JAVA 工程、随 Jar 一起提供出去"。
// 【源码归属】python/ 位于本模块内（engine-server/python，模块资产、src 外）——
// "谁用它在谁家"：Python 引擎是 server 的资产，维护在 Java 工程一棵树里。
// 数据流：python/ 源码 --Copy--> build/python-pack/python/ --> classpath:/python/
// 运行时 PythonBootstrap 从 classpath 解压到 ./python-runtime/ 再拉起子进程。
// 【注意】产物放 build/ 目录而非 src/main/resources——避免把脚本拷进源码树污染 git。
// ============================================================
def pythonSrcDir = file("${projectDir}/python")

task packagePython(type: Copy) {
    group = 'python'
    description = '把 python/ 服务脚本打包进 jar 资源目录'
    from(pythonSrcDir) {
        // 排除 Python 运行时的临时产物
        exclude '__pycache__/**', '*.pyc', '.venv/**', 'models/**'
    }
    into layout.buildDirectory.dir('python-pack/python')
}

// 把 build/python-pack 注册为资源目录，processResources 处理时会一并打入 jar
sourceSets.main.resources.srcDir layout.buildDirectory.dir('python-pack')
processResources.dependsOn packagePython

bootJar {
    archiveFileName = 'engine-server.jar'
}

// ============================================================
// 前端构建任务链：frontend/(npm 工程) 产物随 jar 一起部署
// ------------------------------------------------------------
// 【设计意图】与 packagePython 同一模式——"模块资产、src 外、随 jar 提供"：
// frontend/ 维护在本模块内（engine-server/frontend），构建产物直送 jar 的
// classpath:/static/，由 interfaces/web 三件套（WebStaticConfig 等）服务。
// 数据流：frontend/ → npm run build → dist/ --Copy--> build/frontend-static/static/
//        → sourceSets 注册 → jar 内 BOOT-INF/classes/static/
// 【注意】与 packagePython 一致，产物放 build/ 中转而非 src/main/resources——
// 避免把构建产物拷进源码树污染 git（clean 即还原）。
// 用法：gradlew :engine-server:buildFrontend（copyFrontendDist 随 processResources 联动）
// ------------------------------------------------------------
// 【Groovy 大坑】脚本级 def 局部变量在"任务闭包内"不可见（按项目属性解析后抛
// MissingPropertyException）——路径用 def 只在配置处使用，闭包内一律 ext 属性。
// ============================================================
ext.frontendDir = file("${projectDir}/frontend")
ext.frontendHashFile = new File(project.buildDir, '.frontend-build-hash')
// npm 调用命令平台无关化：Windows 下 npm 是 npm.cmd，必须经 cmd /c 才能被
// ProcessBuilder/Exec 直接执行；Linux（Dockerfile.full 全构建轨容器内）直接
// 调 npm 即可——硬编码 cmd 会让容器内构建直接失败
ext.npmCommandLine = { String... args ->
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    isWindows ? ['cmd', '/c', 'npm'] + args.toList() : ['npm'] + args.toList()
}

task npmInstall(type: Exec) {
    group = 'frontend'
    description = '安装前端依赖（node_modules 缺失时才执行）'
    onlyIf { frontendDir.exists() && !new File(frontendDir, 'node_modules').exists() }
    workingDir frontendDir
    commandLine npmCommandLine('install')
}

// 计算前端源码指纹：没变化就跳过重新构建（避免每次 build 都跑 npm）
def frontendFingerprint() {
    if (!frontendDir.exists()) return null
    def files = fileTree(frontendDir) {
        include 'src/**', 'public/**', 'package.json', 'vite.config.ts', 'tsconfig.json'
        exclude 'node_modules/**', 'dist/**'
    }
    def source = files.files.collect { it.path + ':' + it.lastModified() }.join('\n')
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    digest.digest(source.getBytes('UTF-8')).encodeHex().toString()
}

task buildFrontend(type: Exec) {
    group = 'frontend'
    description = '构建前端工程（源码指纹变化时才执行）'
    onlyIf {
        def fp = frontendFingerprint()
        frontendDir.exists() && (!frontendHashFile.exists() || frontendHashFile.text != fp)
    }
    dependsOn npmInstall
    workingDir frontendDir
    commandLine npmCommandLine('run', 'build')
    doLast {
        def fp = frontendFingerprint()
        if (fp != null) {
            frontendHashFile.parentFile.mkdirs()
            frontendHashFile.text = fp
        }
    }
}

task copyFrontendDist(type: Copy) {
    group = 'frontend'
    description = '把前端产物复制进 jar 资源目录（classpath:/static/，clean-first）'
    onlyIf { new File(frontendDir, 'dist').exists() }
    dependsOn buildFrontend
    // 先清空目标再拷贝：旧哈希资产不残留（与"jar 每次重打"的新鲜度语义一致）
    doFirst { delete layout.buildDirectory.dir('frontend-static') }
    from "${frontendDir}/dist"
    into layout.buildDirectory.dir('frontend-static/static')
}

// 把 build/frontend-static 注册为资源目录，processResources 时一并打入 jar
sourceSets.main.resources.srcDir layout.buildDirectory.dir('frontend-static')
processResources.dependsOn copyFrontendDist

// ============================================================
// Go 工具箱构建任务链：golang/（Go 工程）交叉编译产物随 jar 一起部署
// ------------------------------------------------------------
// 【设计意图】与 packagePython / copyFrontendDist 同一模式——"模块资产、src 外、
// 随 jar 提供"：golang/ 维护在本模块内（engine-server/golang），双平台二进制
// 直送 jar 的 classpath:/golang/<platform>/，运行时 GoProcessLauncher 从
// classpath 解压到 ./go-runtime/<platform>/ 再拉起子进程（定位链生产轨）。
// 数据流：golang/ 源码 --go build(GOOS 交叉)--> build/golang-bin/<platform>/
//        --Copy--> build/golang-pack/golang/<platform>/ --> jar 内
//        BOOT-INF/classes/golang/<platform>/toolbox(.exe)
// 【交叉编译】纯 Go 零 cgo（CGO_ENABLED=0）是 go build 的天然能力——同一台
// Windows 开发机上同时产出 windows/linux amd64 二进制，Docker（linux）与
// 本机（windows）共用同一个 jar（"单 JAR 单 Docker"的构建侧闭环）。
// 【教学注释 · 对比 npm 的 cmd /c】go.exe 是真可执行文件，Exec 直接调 'go' 即可；
// npm 在 Windows 上是 npm.cmd 批处理，才必须经 cmd /c（见上面 npmCommandLine）。
// ------------------------------------------------------------
// 【Groovy 大坑·同 frontend】任务闭包内一律 ext 属性，不用脚本级 def。
// ============================================================
ext.golangDir = file("${projectDir}/golang")
ext.golangHashFile = new File(project.buildDir, '.golang-build-hash')

// 双平台产物表：目录名与 GoProcessLauncher.platformDir 逐字对齐
// （windows-amd64 / linux-amd64），二进制名对齐"windows 加 .exe"的平台惯例
ext.goTargetPlatforms = ['windows-amd64': 'toolbox.exe', 'linux-amd64': 'toolbox']

// Go 工具链探测：无 go 命令时 execute() 抛 IOException（Windows: CreateProcess error=2）
ext.goToolchainAvailable = {
    try {
        def proc = 'go version'.execute()
        proc.waitFor()
        proc.exitValue() == 0
    } catch (IOException ignored) {
        false
    }
}

// 计算 Go 源码指纹（同 frontendFingerprint 的动机：源码不变就不重编——
// 顺带省掉每次构建的工具链探测与进程拉起开销）
def golangFingerprint() {
    if (!golangDir.exists()) return null
    def files = fileTree(golangDir) {
        include '**/*.go', 'go.mod', 'go.sum'
    }
    def source = files.files.collect { it.path + ':' + it.lastModified() }.join('\n')
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    digest.digest(source.getBytes('UTF-8')).encodeHex().toString()
}

// 作废旧产物：二进制与指纹 hash 必须同生同灭——只删二进制不删 hash 会让
// 下一轮"指纹匹配"误判可复用，产物实际已删（jar 静默缺 golang/ 的实测教训）
ext.invalidateGoBinaries = {
    delete layout.buildDirectory.dir('golang-bin')
    delete golangHashFile
}

task buildGoToolbox {
    group = 'golang'
    description = '交叉编译 Go 工具箱双平台二进制（windows/linux amd64，源码指纹变化时才重编）'
    // 【为什么不用 onlyIf 而用任务体分支】skip 分支除了"不编译"还要"作废旧产物"——
    // onlyIf=false 时连 doLast 都不执行，作废动作没处放；而"过期二进制进 jar"
    // 比"jar 里没有二进制"更糟（版本错位静默上线）。四态分支：
    //   golang/ 不存在                   → 跳过（理论上不会发生，防呆）
    //   显式关（-PskipGoBuild）          → 作废旧产物，跳过
    //   无工具链                          → warn + 作废旧产物，跳过（构建不炸：
    //                                      GoProcessLauncher 有 go run 开发轨兜底，
    //                                      且 engine.go.enabled 默认 false 时关闭态零影响）
    //   指纹未变                          → 复用既有二进制，跳过
    //   其余（源码变化 + 工具链在场）      → 双平台交叉编译 + 记录指纹
    // 【输出用英文的原因】Windows 控制台默认 GBK，Gradle 的中文 lifecycle 输出
    // 会打成乱码（同 channelIT 的 file.encoding 注释）——注释中文、输出英文
    doLast {
        def fp = golangFingerprint()
        if (fp == null) {
            logger.lifecycle('golang/ project not found, skip Go toolbox build')
            return
        }
        if (project.hasProperty('skipGoBuild')) {
            logger.lifecycle('-PskipGoBuild set: Go build disabled, invalidating stale binaries')
            invalidateGoBinaries()
            return
        }
        if (!goToolchainAvailable()) {
            logger.warn('No Go toolchain on this machine: skip build and invalidate stale ' +
                    'binaries (jar will NOT contain golang/; runtime falls back to the ' +
                    'go-run dev track, or keep engine.go.enabled=false which is the default)')
            invalidateGoBinaries()
            return
        }
        // 指纹匹配且产物确实在场才复用——产物与 hash 必须同生同灭（见 invalidateGoBinaries）
        def binariesPresent = goTargetPlatforms.every { platform, binary ->
            layout.buildDirectory.file("golang-bin/${platform}/${binary}").get().asFile.exists()
        }
        if (golangHashFile.exists() && golangHashFile.text == fp && binariesPresent) {
            logger.lifecycle('Go source fingerprint unchanged, reuse existing binaries')
            return
        }
        goTargetPlatforms.each { platform, binary ->
            def out = layout.buildDirectory.file("golang-bin/${platform}/${binary}").get().asFile
            out.parentFile.mkdirs()
            project.exec {
                workingDir golangDir
                // GOOS/GOARCH 指定目标平台；CGO_ENABLED=0 纯静态是交叉编译的
                // 前提——一旦引 cgo 就需要目标平台的 C 工具链，纯 Go 才免
                environment 'GOOS', platform.split('-')[0]
                environment 'GOARCH', platform.split('-')[1]
                environment 'CGO_ENABLED', '0'
                // -trimpath 去掉编译机绝对路径（构建可复现，二进制不泄露开发目录）
                commandLine 'go', 'build', '-trimpath', '-o', out, './cmd/toolbox'
            }
            logger.lifecycle("Go toolbox built: golang-bin/${platform}/${binary}")
        }
        golangHashFile.parentFile.mkdirs()
        golangHashFile.text = fp
    }
}

task packageGolang(type: Copy) {
    group = 'golang'
    description = '把 Go 双平台二进制复制进 jar 资源目录（classpath:/golang/<platform>/）'
    dependsOn buildGoToolbox
    // clean-first（同 copyFrontendDist）：无产物/产物被作废时也让 golang-pack 归零——
    // 过期二进制绝不进 jar；golang-bin 缺失时 Copy 无源可拷是合法空跑
    doFirst { delete layout.buildDirectory.dir('golang-pack') }
    from layout.buildDirectory.dir('golang-bin')
    into layout.buildDirectory.dir('golang-pack/golang')
}

// 把 build/golang-pack 注册为资源目录，processResources 时一并打入 jar
sourceSets.main.resources.srcDir layout.buildDirectory.dir('golang-pack')
processResources.dependsOn packageGolang

// ============================================================
// channelIT — 双通道集成测试（拉真实 Python 子进程）
// 用法: gradlew :engine-server:channelIT
// 【教学注释 · JavaExec】在 Gradle 里直接跑一个带 classpath 的 main 方法，
// 比 jar 更轻量；测试环境自适应：python/ 目录自动定位（见测试类 findRepoRoot）
// ============================================================
tasks.register('channelIT', JavaExec) {
    group = 'verification'
    description = 'Python 双通道（stdio + py4j）集成测试'
    classpath = sourceSets.test.runtimeClasspath
    main = 'io.github.dekkerding.engine.infrastructure.python.PythonChannelIntegrationTest'
    // Windows 控制台默认 GBK：强制 JVM 输出 UTF-8，否则测试日志中文全是乱码
    jvmArgs '-Dfile.encoding=UTF-8'
    // Python 子进程继承 UTF-8 环境
    environment 'PYTHONIOENCODING', 'utf-8'
    environment 'HF_ENDPOINT', 'https://hf-mirror.com'
}
