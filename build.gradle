/*
 * ============================================================
 * 根 build.gradle — 所有子模块共享的公共配置
 * ------------------------------------------------------------
 * 【教学注释】多模块 Gradle 工程的分层配置思想：
 *   - 根 build.gradle：放"所有模块都要遵守的规则"（编码、JDK 版本、仓库）
 *   - 子模块 build.gradle：只放"该模块特有的东西"（依赖、打包任务）
 *   好处：改一处，全模块生效——这就是 DRY 原则在构建脚本里的体现。
 *
 * 【技术约束】项目锁定 JDK 1.8 + Spring Boot 2.6.14，禁止升级
 * （企业兼容性要求；JDK 8 下许多新版库不可用，选型时必须核对）
 * ============================================================
 */

// 所有模块（含根）的坐标：group + version 决定产物 jar 的命名
allprojects {
    group = 'io.github.dekkerding'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java'

    // 【关键】全链路 UTF-8：Windows 默认 GBK，不设置会导致中文注释/字符串编译乱码
    // compileJava/compileTestJava 是 Gradle 内置任务，*.options*.encoding 是 Groovy 的展开操作符
    [compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

    // 锁定 JDK 1.8 语法级别（写了 var/switch表达式 等 JDK11+ 语法会直接编译失败）
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'

    repositories {
        // 依赖仓库：只保留必要的几个（蓝本项目塞了 20+ 个仓库，其中多数已失效）
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/spring' }
        mavenCentral()
    }

    // 公共测试依赖：每个模块都用 JUnit 5（Spring Boot 2.6 默认测试栈）
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.withType(Test) {
        useJUnitPlatform()
        // 测试输出 UTF-8，避免 Windows 控制台中文乱码
        systemProperty 'file.encoding', 'UTF-8'
    }
}

// 【单 JAR 合体】前端构建任务链已迁至 engine-server/build.gradle（frontend/
// 工程与产物随该模块 jar 提供，对齐 packagePython 模式）——根脚本不再承载模块细节。
