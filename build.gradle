/*
 * ============================================================
 * 根 build.gradle — 所有子模块共享的公共配置
 * ------------------------------------------------------------
 * 【教学注释】多模块 Gradle 工程的分层配置思想：
 *   - 根 build.gradle：放"所有模块都要遵守的规则"（编码、JDK 版本、仓库）
 *   - 子模块 build.gradle：只放"该模块特有的东西"（依赖、打包任务）
 *   好处：改一处，全模块生效——这就是 DRY 原则在构建脚本里的体现。
 *
 * 【技术约束】项目锁定 JDK 1.8 + Spring Boot 2.6.14，禁止升级
 * （企业兼容性要求；JDK 8 下许多新版库不可用，选型时必须核对）
 * ============================================================
 */

// 所有模块（含根）的坐标：group + version 决定产物 jar 的命名
allprojects {
    group = 'io.github.dekkerding'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java'

    // 【关键】全链路 UTF-8：Windows 默认 GBK，不设置会导致中文注释/字符串编译乱码
    // compileJava/compileTestJava 是 Gradle 内置任务，*.options*.encoding 是 Groovy 的展开操作符
    [compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

    // 锁定 JDK 1.8 语法级别（写了 var/switch表达式 等 JDK11+ 语法会直接编译失败）
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'

    repositories {
        // 依赖仓库：只保留必要的几个（蓝本项目塞了 20+ 个仓库，其中多数已失效）
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/spring' }
        mavenCentral()
    }

    // 公共测试依赖：每个模块都用 JUnit 5（Spring Boot 2.6 默认测试栈）
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.withType(Test) {
        useJUnitPlatform()
        // 测试输出 UTF-8，避免 Windows 控制台中文乱码
        systemProperty 'file.encoding', 'UTF-8'
    }
}

// ============================================================
// 前端构建任务链（挂在根项目；网关 Go 化后从旧 engine-gateway/build.gradle 迁移）
// 数据流：frontend/(npm 工程) → npm run build → dist/ → engine-gateway/static/ → Go 网关运行时读取
// 用法：./gradlew buildFrontend copyFrontendDist（无模块前缀，根任务）
// ------------------------------------------------------------
// 【Groovy 大坑】脚本级 def 局部变量在"方法/闭包内"不可见（会按项目属性解析然后抛
// MissingPropertyException）——必须用 ext 属性（项目级全局变量）。
// ============================================================
ext.frontendDir = file("${rootDir}/frontend")
ext.frontendHashFile = new File(project.buildDir, '.frontend-build-hash')
// 产物目标：Go 网关的 static 目录（运行时由二进制按 config static.dir 读取，不再是 jar 资源）
ext.gatewayStaticDir = file("${rootDir}/engine-gateway/static")
// npm 调用命令平台无关化：Windows 下 npm 是 npm.cmd，必须经 cmd /c 才能被
// ProcessBuilder/Exec 直接执行；Linux（Dockerfile.full 全构建轨容器内）直接
// 调 npm 即可——硬编码 cmd 会让容器内构建直接失败
ext.npmCommandLine = { String... args ->
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    isWindows ? ['cmd', '/c', 'npm'] + args.toList() : ['npm'] + args.toList()
}

task npmInstall(type: Exec) {
    group = 'frontend'
    description = '安装前端依赖（node_modules 缺失时才执行）'
    onlyIf { frontendDir.exists() && !new File(frontendDir, 'node_modules').exists() }
    workingDir frontendDir
    commandLine npmCommandLine('install')
}

// 计算前端源码指纹：没变化就跳过重新构建（避免每次 build 都跑 npm）
def frontendFingerprint() {
    if (!frontendDir.exists()) return null
    def files = fileTree(frontendDir) {
        include 'src/**', 'public/**', 'package.json', 'vite.config.ts', 'tsconfig.json'
        exclude 'node_modules/**', 'dist/**'
    }
    def source = files.files.collect { it.path + ':' + it.lastModified() }.join('\n')
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    digest.digest(source.getBytes('UTF-8')).encodeHex().toString()
}

task buildFrontend(type: Exec) {
    group = 'frontend'
    description = '构建前端工程（源码指纹变化时才执行）'
    onlyIf {
        def fp = frontendFingerprint()
        frontendDir.exists() && (!frontendHashFile.exists() || frontendHashFile.text != fp)
    }
    dependsOn npmInstall
    workingDir frontendDir
    commandLine npmCommandLine('run', 'build')
    doLast {
        def fp = frontendFingerprint()
        if (fp != null) {
            frontendHashFile.parentFile.mkdirs()
            frontendHashFile.text = fp
        }
    }
}

task copyFrontendDist(type: Copy) {
    group = 'frontend'
    description = '把前端产物复制进 Go 网关的静态资源目录（engine-gateway/static/）'
    onlyIf { new File(frontendDir, 'dist').exists() }
    dependsOn buildFrontend
    // 先清空目标目录再拷贝：旧哈希资产不残留（与"jar 每次重打"的新鲜度语义一致）
    doFirst { gatewayStaticDir.deleteDir() }
    from "${frontendDir}/dist"
    into gatewayStaticDir
}
